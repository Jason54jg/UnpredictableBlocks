plugins {
    id "dev.kikugie.stonecutter"
}
stonecutter.active "26.2"

def supported = (findProperty('supported_minecraft_versions') ?: '26.1.2')
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { it }

def versionProps = { String mc ->
    def f = file("versions/${mc}/gradle.properties")
    if (!f.exists()) {
        throw new GradleException("Missing versions/${mc}/gradle.properties")
    }
    def p = new Properties()
    f.withInputStream { p.load(it) }
    def map = new LinkedHashMap<String, String>()
    p.each { k, v -> map.put(k.toString(), v.toString()) }
    map.put('target_mc_version', mc)
    return map
}

def runGradlew = { List<String> args ->
    def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    def cmd = isWindows
            ? (['C:\\Program Files\\Git\\bin\\bash.exe', './gradlew'] + args)
            : (['./gradlew'] + args)
    def pb = new ProcessBuilder(cmd)
    pb.directory(rootDir)
    pb.redirectErrorStream(true)
    def proc = pb.start()
    proc.inputStream.eachLine { line -> logger.lifecycle(line) }
    def code = proc.waitFor()
    if (code != 0) {
        throw new GradleException("gradlew failed with exit ${code}: ${args.join(' ')}")
    }
}

def prevTaskName = null
supported.each { mc ->
    def safe = mc.replace('.', '_')
    def taskName = "buildMc_${safe}"
    def props = versionProps(mc)
    def propArgs = props.collect { k, v -> "-P${k}=${v}".toString() }
    // Capture locals for deferred task configuration (avoid self mustRunAfter).
    def previousTaskName = prevTaskName
    def mcVersion = mc
    def mcPropArgs = propArgs
    tasks.register(taskName) {
        group = 'build'
        description = "Build Fabric + NeoForge for Minecraft ${mcVersion}"
        if (previousTaskName != null) {
            mustRunAfter previousTaskName
        }
        doLast {
            // Build first, then collect in a second invocation so we never copy stale jars
            // (Gradle can otherwise parallelize collectVersionJars with :neoforge:build).
            runGradlew([
                    "Set active project to ${mcVersion}".toString(),
                    ':fabric:build',
                    ':neoforge:build',
            ] + mcPropArgs + ['--console=plain', '--no-configuration-cache'])
            runGradlew([
                    ":${mcVersion}:collectVersionJars".toString(),
            ] + mcPropArgs + ['--console=plain', '--no-configuration-cache'])
        }
    }
    prevTaskName = taskName
}

tasks.register('resetActiveMinecraftVersion') {
    group = 'build'
    doLast {
        runGradlew(['Reset active project', '--console=plain'])
    }
}

tasks.register('buildAllMinecraftVersions') {
    group = 'build'
    description = 'Build all supported Minecraft versions (Fabric + NeoForge)'
    supported.each { mc ->
        dependsOn "buildMc_${mc.replace('.', '_')}"
    }
    finalizedBy 'resetActiveMinecraftVersion'
    doLast {
        def multi = file('build/libs-multi')
        if (!multi.exists()) {
            logger.warn('No build/libs-multi output yet')
            return
        }
        logger.lifecycle('Multi-version jars:')
        multi.listFiles()?.each { d ->
            d.listFiles()?.each { f -> logger.lifecycle("  ${d.name}/${f.name}") }
        }
    }
}

tasks.register('chiseledBuild') {
    group = 'project'
    description = 'Build Fabric + NeoForge for 26.1.2, 26.2 and 26.3'
    dependsOn 'buildAllMinecraftVersions'
}