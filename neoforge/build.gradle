plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mcVersion = rootProject.findProperty('minecraft_version')?.toString() ?: '26.1.2'
def neoVersion = rootProject.findProperty('neoforge_version')?.toString()
def archVersion = rootProject.findProperty('architectury_version')?.toString() ?: '22.0.5'
def geckolibVersion = rootProject.findProperty('geckolib_version')?.toString() ?: '5.5.2'

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

version = "${rootProject.mod_version}+${mcVersion}"

sourceSets {
    client {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
}

dependencies {
    implementation "dev.architectury:architectury-neoforge:${archVersion}"
    implementation "com.geckolib:geckolib-neoforge-${mcVersion}:${geckolibVersion}"
    implementation project(':common')
}

neoForge {
    version = neoVersion ?: rootProject.neoforge_version

    addModdingDependenciesTo sourceSets.client

    mods {
        unpredictableblocks {
            sourceSet sourceSets.main
        }
        unpredictableblocks_client {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            loadedMods = [mods.unpredictableblocks]
        }
        client {
            client()
            sourceSet = sourceSets.client
            loadedMods = [mods.unpredictableblocks_client]
        }
    }
}

// 26.1.2 → Architectury 20.1.x ; 26.2 → 21.1.x ; 26.3 → 22.0.x — pas de floor hardcodé 21.0.
def archVersionRange = {
    def parts = archVersion.tokenize('.')
    def majorMinor = parts.size() >= 2 ? "${parts[0]}.${parts[1]}" : archVersion
    "[${majorMinor},)"
}()

processResources {
    inputs.property 'version', version
    inputs.property 'architectury_version_range', archVersionRange
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version, architectury_version_range: archVersionRange
    }
}

// Bundle common classes + resources into the distributable jar.
tasks.named('jar', Jar).configure {
    dependsOn(':common:jar')
    from({
        zipTree(project(':common').tasks.named('jar', Jar).flatMap { it.archiveFile })
    }) {
        exclude 'fabric.mod.json'
        exclude 'architectury.common.json'
    }
    from sourceSets.client.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': project.base.archivesName.get(),
                'Implementation-Version': project.version,
                'Specification-Title': 'unpredictableblocks',
                'Specification-Version': project.version
        )
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
