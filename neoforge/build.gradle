plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mcVersion = rootProject.findProperty('minecraft_version')?.toString() ?: '26.1.2'
def neoVersion = rootProject.findProperty('neoforge_version')?.toString()

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

version = "${rootProject.mod_version}+${mcVersion}"

dependencies {
    implementation project(':common')
}

neoForge {
    version = neoVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
