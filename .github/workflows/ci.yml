name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regénérer les assets
        run: |
          pip install -r tools/requirements.txt
          python3 tools/generate_textures.py
          python3 tools/generate_item_textures.py
          python3 tools/generate_structures.py

  build:
    runs-on: ubuntu-latest
    needs: assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle compile
        run: |
          chmod +x gradlew
          ./gradlew :common:compileJava :fabric:compileJava :neoforge:compileJava --no-daemon --stacktrace
        continue-on-error: true
